[package]
name = "mcp-vault-proxy"
version = "0.1.0"
edition = "2021"
description = "Secure credential sidecar for MCP servers — injects auth from Vaultwarden without exposing secrets to AI agents"
license = "MIT"
repository = "https://github.com/ajarratt/mcp-vault-proxy"
homepage = "https://github.com/ajarratt/mcp-vault-proxy"
keywords = ["mcp", "vaultwarden", "credentials", "security", "proxy"]
categories = ["authentication", "network-programming"]

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["sha2"] }
zeroize = { version = "1", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
memsec = "0.7"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.13"
tokio-rustls = "0.26"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tss-esapi = { version = "7", features = ["generate-bindings"], optional = true }
clap = { version = "4", features = ["derive", "env"] }
# rpassword prompts read stdin with terminal echo disabled, so master/setup
# passwords entered during CLI setup don't end up visible on-screen or in
# scroll-back buffers. Echoed read_line() was the pre-iter-15 behavior.
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dashmap = "6"
base64 = "0.22"
rand = "0.8"
rsa = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
sha1 = "0.10"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
bcrypt = "0.16"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
async-trait = "0.1"
toml = "0.8"
shell-words = "1"

[features]
default = []
tpm = ["tss-esapi"]
dashboard = []

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
