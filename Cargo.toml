[package]
name = "vaultproxy"
version = "1.11.0"
edition = "2021"
# MSRV: 1.88 — the effective floor is set by transitive dependencies, not by
# this crate's own syntax.  `let-chains` usage requires 1.87, but three
# transitive deps (time 0.3.47, time-core 0.1.8, cookie_store 0.22.1) declare
# `rust-version = "1.88"`, which `rustup run 1.87 cargo check` reports as an
# error.  Bumped from 1.87 → 1.88 in iter-82 after `rustup run 1.87 cargo
# check` failed on the current lockfile.  Update this field whenever a
# transitive dep raises its own MSRV.
rust-version = "1.88"
description = "Secure credential sidecar for MCP servers — injects auth from Vaultwarden without exposing secrets to AI agents"
license = "MIT"
repository = "https://github.com/aaronckj/vaultproxy"
homepage = "https://github.com/aaronckj/vaultproxy"
keywords = ["mcp", "vaultwarden", "credentials", "security", "proxy"]
categories = ["authentication", "network-programming"]

# Files excluded from the published crates.io tarball. `target/`, `.git/`, and
# anything matched by `.gitignore` are excluded by Cargo automatically; this
# list catches things that are checked in but not useful to crates.io users.
exclude = [
    "playwright/__pycache__/",
    "playwright/**/*.pyc",
    "**/.DS_Store",
    "dashboard/node_modules/",
    "GAPS.md",
]

[lib]
name = "vaultproxy"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "mcp-bearer-bridge"
path = "src/bin/mcp_bearer_bridge.rs"

[[bin]]
name = "vaultproxy-mount-helper"
path = "src/bin/mount_helper.rs"

[[bin]]
name = "mcp-rpc-bridge"
path = "src/bin/mcp_rpc_bridge.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["sha2"] }
zeroize = { version = "1", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
memsec = "0.7"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
# Used by src/tpm.rs (sealed-keystore helpers, always compiled) and the
# transparent HTTPS_PROXY MITM cert factory (--features transparent).
# Always pulled in; the `transparent` feature does not re-enable it.
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "aws_lc_rs", "x509-parser"] }

# In-memory LRU cache for transparent-mode leaf certs. Optional.
lru = { version = "0.12", optional = true }

# Parses upstream X.509 certs in the transparent MITM cert factory so the
# locally signed leaf can mirror the upstream's SAN list. Also used in
# BYO-CA validation to enforce basicConstraints CA:TRUE.
x509-parser = { version = "0.16", optional = true }

# Loads the platform's trust store so the transparent forwarder can
# verify upstream TLS certs the same way curl/browsers do.
rustls-native-certs = { version = "0.8", optional = true }

# `hostname::get()` populates the CA's CN with the host vault-proxy runs
# on, so operators can tell which machine signed a given leaf.
hostname = { version = "0.4", optional = true }

# `time` is already pulled in transitively by chrono/rcgen; we declare it
# directly because src/tls/ca.rs constructs `time::OffsetDateTime` values
# for cert validity windows. Pinning to a major version we know works.
time = "0.3"

# `pem` is already pulled in transitively by rcgen; declared directly
# because src/tls/ca.rs parses CA cert PEM into DER for fingerprinting.
pem = "3"

# `bytes::Bytes` is used by src/proxy/transparent/mitm.rs to hold
# request bodies between the agent-side read and the upstream-side
# forward. Already in tree via reqwest/hyper.
bytes = "1"

# Native HTTP/2 framing for the transparent MITM listener (v1.7.0+).
# Already in tree via reqwest/hyper; declared directly so
# src/proxy/transparent/h2_mitm.rs can construct a `h2::server::Builder`
# and an `http::Request<()>` from the agent's h2 stream.
h2 = "0.4"
http = "1"

# Used by src/proxy/transparent/inject_host.rs for query_param auth
# URL-encoding. Tiny crate (~3 KB).
urlencoding = "2"

tokio-rustls = "0.26"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tss-esapi = { version = "7", features = ["generate-bindings"], optional = true }
clap = { version = "4", features = ["derive", "env"] }
# rpassword prompts read stdin with terminal echo disabled, so master/setup
# passwords entered during CLI setup don't end up visible on-screen or in
# scroll-back buffers. Echoed read_line() was the pre-iter-15 behavior.
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dashmap = "6"
base64 = "0.22"
rand = "0.8"
rmcp = { version = "1.6", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.0"
# RUSTSEC-2023-0071: rsa 0.9 is affected by the Marvin Attack (RSA timing
# side-channel). No fixed version exists for 0.9.x. The crate is used only
# for Bitwarden type-4 cipher-string decryption (organisation key unwrapping),
# which is a one-shot operation at vault sync time on a localhost-only service.
# The practical exploitation window is narrow, but this should be revisited
# when a patched rsa crate is available.
# TODO: migrate to ring's RSA-OAEP-SHA1 once ring publishes a stable async API,
# or replace with a purpose-built OAEP implementation that is constant-time.
rsa = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
sha1 = "0.10"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
bcrypt = "0.16"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
async-trait = "0.1"
toml = "0.8"
shell-words = "1"
tera = { version = "1", default-features = false, features = ["builtins"] }
tempfile = "3"
# hyper-util is a transitive dependency of axum; we declare it explicitly to
# call http1().timer(TokioTimer).header_read_timeout(5s) on the serve loop.
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service", "http1"] }
# libc is only used for the root-check (geteuid) on Unix; it does not compile
# on Windows without the Win32 POSIX compat layer. Restrict to unix targets so
# `cargo build --target x86_64-pc-windows-gnu` doesn't fail.
# (iter-19 fix: was an unconditional [dependencies] entry)

[features]
# Default build now includes the transparent HTTPS_PROXY listener
# (v1.2 onward; was opt-in through v1.1.x). `inject_host` resolves
# credentials via the real Vaultwarden decrypt path (test-utils
# builds substitute the stub via `VaultManager::test_item_password`).
# Other opt-in features (dashboard, tpm, browser, engine) remain
# disabled by default.
default = ["transparent"]

# Expose VaultManager::new_stub() and new_stub_with_keys() outside of #[cfg(test)].
# Used by integration tests in the `tests/` directory which cannot access
# cfg(test)-gated items from the library crate.
test-utils = []

# Enable hardware-backed keystore sealing via TPM 2.0 (requires TSS2 system
# libraries: libtss2-dev / tss2-esapi on the host). On hosts without a TPM the
# build succeeds but sealing is a no-op (software fallback remains).
# Build: cargo build --release --features tpm
tpm = ["tss-esapi"]

# Enable the web management dashboard on 127.0.0.1:3202 (HTTPS, self-signed cert).
# The dashboard provides a UI for setup, unlock, service inspection, audit logs,
# and tool-permission management. Not required for headless/Docker deployments
# where --setup runs the CLI wizard.
# Build: cargo build --release --features dashboard
dashboard = []

# Enable the browser-based automated credential rotation subsystem.
#
# This feature compiles in the `browser` module (PlaywrightProcess, VisionModel,
# RotationWorkflow) and wires up the /browser/* HTTP routes. It requires:
#   - A LiteLLM-compatible vision model endpoint (LITELLM_URL + VISION_MODEL)
#   - Playwright/agent.py mounted at /app/playwright/agent.py (or PLAYWRIGHT_AGENT_PATH)
#
# When this feature is OFF (the default), the /browser/* routes are absent from
# the router and the `browser` field is absent from AppState. The binary is
# smaller and has no dependency on the vision workflow scaffold code.
#
# Build: cargo build --release --features browser
# Docker: docker build --build-arg FEATURES=browser -t vaultproxy:browser .
#         docker build --build-arg FEATURES=dashboard,browser -t vaultproxy:full .
browser = []

# Enable the credential-audit engine sidecar path.
#
# This feature compiles in the external-engine modules of `credential_audit`:
#   - engine_client  (HTTP client for the /audit/run and /judge_login endpoints)
#   - orchestrator   (scan coordination, DB writes, engine health checks)
#   - pass2          (per-item login-attempt worker, rate limiting, blacklisting)
#
# It also wires up the /audit/credaudit/* HTTP routes.
#
# The in-process credential health audit (`src/audit.rs` + GET /vault/audit/run)
# is NOT gated — it is part of the stable core and always compiled.
#
# When this feature is OFF (the default), the engine sidecar routes are absent.
# Operators who do not run a credential-audit engine sidecar (most deployments)
# get a smaller binary with no scaffold code.
#
# Build: cargo build --release --features engine
# Docker: docker build --build-arg FEATURES=engine -t vaultproxy:engine .
engine = []

# Enable the transparent HTTPS_PROXY listener (port 3203 by default).
# When OFF (default through v1.1), the src/proxy/transparent/ module is
# excluded from compilation, no listener binds 3203, no CA cert is
# generated, no new CLI flags appear in `vault-proxy --help`. The binary
# behaves identically to v1.0 for operators who do not opt in.
#
# When ON, vault-proxy ALSO accepts HTTPS_PROXY traffic on 3203 and can
# inject vault credentials into upstream HTTPS requests based on
# services.toml. See docs/operator/TRANSPARENT.md for the operator guide
# and SECURITY.md for the threat model.
#
# Build: cargo build --release --features transparent
# Docker: docker build --build-arg FEATURES=transparent -t vaultproxy:transparent .
transparent = ["dep:lru", "dep:x509-parser", "dep:rustls-native-certs", "dep:hostname"]

# NOTE: There is intentionally no "minimal" feature flag to strip subsystems
# (cloud sync, launcher, etc.) from Docker builds. Those subsystems are
# compile-time zero-cost unless explicitly invoked at runtime — they add no
# measurable startup time or memory overhead when idle.
#
# The largest single contributor to binary size is `rusqlite` with `bundled`
# (embeds a full SQLite build). If you do not use the credential-audit subsystem,
# removing `bundled` and depending on the system SQLite library will shave ~1 MB.
# This is not done by default because the Docker image has no system SQLite.

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
# tokio test-util enables tokio::time::pause() / advance() for timer-driven tests.
tokio = { version = "1", features = ["test-util"] }
