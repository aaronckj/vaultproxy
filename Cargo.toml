[package]
name = "vaultproxy"
version = "0.2.14"
edition = "2021"
# MSRV is not declared here because transitive dependencies (cookie_store,
# time, icu_* crates) currently require recent stable releases and their
# minimum versions change with each `cargo update`. The CI workflow pins a
# specific stable toolchain version in .github/workflows/docker-publish.yml;
# a formal `rust-version` field should be added once dependency churn settles
# and the true floor is stable across a lockfile update cycle.
description = "Secure credential sidecar for MCP servers — injects auth from Vaultwarden without exposing secrets to AI agents"
license = "MIT"
repository = "https://github.com/aaronckj/vaultproxy"
homepage = "https://github.com/aaronckj/vaultproxy"
keywords = ["mcp", "vaultwarden", "credentials", "security", "proxy"]
categories = ["authentication", "network-programming"]

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["sha2"] }
zeroize = { version = "1", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
memsec = "0.7"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.13"
tokio-rustls = "0.26"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tss-esapi = { version = "7", features = ["generate-bindings"], optional = true }
clap = { version = "4", features = ["derive", "env"] }
# rpassword prompts read stdin with terminal echo disabled, so master/setup
# passwords entered during CLI setup don't end up visible on-screen or in
# scroll-back buffers. Echoed read_line() was the pre-iter-15 behavior.
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dashmap = "6"
base64 = "0.22"
rand = "0.8"
# RUSTSEC-2023-0071: rsa 0.9 is affected by the Marvin Attack (RSA timing
# side-channel). No fixed version exists for 0.9.x. The crate is used only
# for Bitwarden type-4 cipher-string decryption (organisation key unwrapping),
# which is a one-shot operation at vault sync time on a localhost-only service.
# The practical exploitation window is narrow, but this should be revisited
# when a patched rsa crate is available.
# TODO: migrate to ring's RSA-OAEP-SHA1 once ring publishes a stable async API,
# or replace with a purpose-built OAEP implementation that is constant-time.
rsa = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
sha1 = "0.10"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
bcrypt = "0.16"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
async-trait = "0.1"
toml = "0.8"
shell-words = "1"
# hyper-util is a transitive dependency of axum; we declare it explicitly to
# call http1().timer(TokioTimer).header_read_timeout(5s) on the serve loop.
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service", "http1"] }
# libc is only used for the root-check (geteuid) on Unix; it does not compile
# on Windows without the Win32 POSIX compat layer. Restrict to unix targets so
# `cargo build --target x86_64-pc-windows-gnu` doesn't fail.
# (iter-19 fix: was an unconditional [dependencies] entry)

[features]
# `default` = no optional features. This is the recommended build for Docker/server
# deployments — it includes all proxy, vault, launcher, and browser-rotation
# functionality but omits the web dashboard and TPM hardware binding.
default = []

# Enable hardware-backed keystore sealing via TPM 2.0 (requires TSS2 system
# libraries: libtss2-dev / tss2-esapi on the host). On hosts without a TPM the
# build succeeds but sealing is a no-op (software fallback remains).
# Build: cargo build --release --features tpm
tpm = ["tss-esapi"]

# Enable the web management dashboard on 127.0.0.1:3202 (HTTPS, self-signed cert).
# The dashboard provides a UI for setup, unlock, service inspection, audit logs,
# and tool-permission management. Not required for headless/Docker deployments
# where --setup runs the CLI wizard.
# Build: cargo build --release --features dashboard
dashboard = []

# NOTE: There is intentionally no "minimal" feature flag to strip subsystems
# (cloud sync, browser rotation, launcher, etc.) from Docker builds.
# All of these subsystems are compile-time zero-cost unless explicitly invoked
# at runtime — they add no measurable startup time or memory overhead when idle.
# The binary size difference between a "full" and "minimal" build is ~1-2 MB
# on stripped release builds, which is not worth maintaining a parallel feature
# matrix. If binary size becomes a concern, consider profiling with `bloat` and
# stripping specific heavy dependencies (tokio-tungstenite, rcgen) via features.
#
# The largest single contributor to binary size is `rusqlite` with `bundled`
# (embeds a full SQLite build). If you do not use the credential-audit subsystem,
# removing `bundled` and depending on the system SQLite library will shave ~1 MB.
# This is not done by default because the Docker image has no system SQLite.

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
# tokio test-util enables tokio::time::pause() / advance() for timer-driven tests.
tokio = { version = "1", features = ["test-util"] }
