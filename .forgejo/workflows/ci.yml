name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # transparent is opt-in as of v1.12.0, so build/test BOTH the shipped
      # default (no transparent) and the opt-in path.
      - name: Build (default features)
        run: cargo build --release --bins --locked

      - name: Build (transparent)
        run: cargo build --release --bins --features transparent --locked

      - name: Test (default features)
        run: cargo test --release --features test-utils --locked

      # The transparent E2E smoke tests each bind a listener; run single-threaded
      # so concurrent instances don't race on ports.
      - name: Test (transparent)
        run: cargo test --release --features test-utils,transparent --locked -- --test-threads=1
