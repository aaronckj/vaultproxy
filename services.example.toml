# vaultproxy service configuration
# ──────────────────────────────────────────────────────────────────────────────
# HOW TO USE THIS FILE
#
# 1. Copy this file to your config directory as services.toml:
#      cp services.example.toml ./config/services.toml
#
# 2. Edit the [[service]] blocks below to match your services.
#    Delete any services you don't use — unused blocks don't cause errors, but
#    clean configs are easier to maintain.
#
# 3. Validate the file before deploying:
#      vaultproxy --check --config-dir ./config
#    This parses services.toml, checks SSRF rules, and prints OK or error details.
#    No Vaultwarden connection or credentials are required.
#
# 4. Restart vault-proxy (or send SIGHUP / call POST /vault/reload-services)
#    to pick up changes.
#
# ── WHAT IS vault_item? ───────────────────────────────────────────────────────
#
# `vault_item` is the NAME of an item in your Vaultwarden folder (default folder
# name: "vault-proxy", controlled by VAULT_FOLDER).  vault-proxy looks up that
# item at startup and uses its password field (or a custom field) as the auth
# credential.  The actual secret never leaves vault-proxy.
#
# Example: for a Home Assistant service with
#     vault_item = "vault-proxy - Home Assistant"
# you must have an item named exactly "vault-proxy - Home Assistant" in the
# "vault-proxy" folder in Vaultwarden, with the Bearer token in the password field.
#
# ── FIELDS OVERVIEW ───────────────────────────────────────────────────────────
#
# Required for every service:
#   name       — identifier used in POST /proxy requests: {"service": "ha_home", ...}
#   base_url   — scheme + host + optional path prefix of the downstream service
#   auth       — auth method: bearer | header | query_param | basic | session | unifi_dual
#   vault_item — Vaultwarden item name that holds the credential
#
# Optional:
#   insecure_tls = true   — skip TLS cert verification (only for self-signed LAN services)
#   ca_cert = "/path"     — path to a PEM CA cert for services with a private CA
#   timeout_secs = 60     — per-service request timeout in seconds, overrides global
#                           --proxy-timeout (default 120 s) for this service only.
#                           Useful when one service is legitimately slow (e.g. a Plex
#                           library scan) or should fail fast (e.g. a health-check call
#                           that should give up in 5 s). Must be > 0; values > 600 s
#                           emit a startup warning. Omit entirely to use the global timeout.
#
# Auth-specific required fields (see README for full reference):
#   header:       header_name (e.g. "X-Api-Key")
#   query_param:  param_name  (e.g. "apikey")
#   basic:        key_field, secret_field (names of the custom fields in Vaultwarden)
#   session:      login_path, token_field
#   unifi_dual:   login_path
# ──────────────────────────────────────────────────────────────────────────────

# Each [[service]] block registers one service with the proxy.
# The `name` field is what you pass as "service" in POST /proxy requests.
# The `vault_item` field must match an item name in your Vaultwarden vault-proxy folder.

# ── Bearer token (e.g. Home Assistant long-lived access token) ──────────────
[[service]]
name = "ha_home"
base_url = "http://homeassistant.local:8123"
auth = "bearer"
vault_item = "vault-proxy - Home Assistant"
# timeout_secs = 60   # optional: HA automations can run for 30+ seconds; raise
                      # this if long-running service calls are timing out.
                      # Default is the global --proxy-timeout (120 s).

# ── API key injected as a header (e.g. Sonarr, Radarr, Overseerr) ───────────
[[service]]
name = "sonarr"
base_url = "http://sonarr.local:8989/api/v3"
auth = "header"
header_name = "X-Api-Key"
vault_item = "vault-proxy - Sonarr"

[[service]]
name = "radarr"
base_url = "http://radarr.local:7878/api/v3"
auth = "header"
header_name = "X-Api-Key"
vault_item = "vault-proxy - Radarr"

[[service]]
name = "overseerr"
base_url = "http://overseerr.local:5055/api/v1"
auth = "header"
header_name = "X-Api-Key"
vault_item = "vault-proxy - Overseerr"

# ── API key as a query parameter (e.g. Tautulli) ────────────────────────────
[[service]]
name = "tautulli"
base_url = "http://tautulli.local:8181"
auth = "query_param"
param_name = "apikey"
vault_item = "vault-proxy - Tautulli"

# ── HTTP Basic auth (e.g. OPNsense — uses key/secret custom fields) ─────────
[[service]]
name = "opnsense_main"
base_url = "https://opnsense.local/api"
auth = "basic"
key_field = "key"
secret_field = "secret"
vault_item = "vault-proxy - OPNsense"
insecure_tls = true        # OPNsense uses a self-signed cert by default

# ── Service signed by a private / internal CA ────────────────────────────────
# Use ca_cert instead of insecure_tls = true when your service has a cert
# signed by your own CA (e.g. an internal PKI). This verifies the cert chain
# against YOUR CA without disabling all TLS validation.
# insecure_tls = true would skip all verification; ca_cert = ... is safer.
#
# The ca_cert path must be readable by the vault-proxy process at startup.
# Common locations:
#   Docker Compose (./config:/config mount):  /config/internal-ca.pem
#   Bare metal:                               /etc/ssl/vaultproxy/ca.pem
# Change this path to match your actual deployment; the example below is a
# placeholder that will cause a startup error if used without modification.
#
# [[service]]
# name = "internal_service"
# base_url = "https://service.internal.corp/api"
# auth = "bearer"
# vault_item = "vault-proxy - Internal Service"
# ca_cert = "/config/internal-ca.pem"   # CHANGE THIS: path to your PEM CA cert

# ── Session login (POST credentials, use returned token) ────────────────────
[[service]]
name = "npm_main"
base_url = "http://npm.local:81/api"
auth = "session"
vault_item = "vault-proxy - Nginx Proxy Manager"
login_path = "/tokens"
token_field = "token"

[[service]]
name = "duplicati_main"
base_url = "http://duplicati.local:8200/api/v1"
auth = "session"
vault_item = "vault-proxy - Duplicati"
login_path = "/auth/login"
token_field = "AccessToken"
login_include_username = false   # Duplicati's login API accepts only a password, no username field

# ── UniFi dual auth (API key first, session fallback) ───────────────────────
[[service]]
name = "unifi_home"
base_url = "https://unifi.local/proxy/network"
auth = "unifi_dual"
vault_item = "vault-proxy - UniFi"
login_path = "/api/auth/login"

# ── Plex (X-Plex-Token header) ───────────────────────────────────────────────
# Plex library scans can take minutes; set timeout_secs to allow for that.
# Omit timeout_secs (or remove the line) to use the global --proxy-timeout.
[[service]]
name = "plex"
base_url = "http://plex.local:32400"
auth = "header"
header_name = "X-Plex-Token"
vault_item = "vault-proxy - Plex"
# timeout_secs = 300   # optional: 5-minute budget for slow library scans
                       # (Plex /library/sections/:id/refresh can take 3–5 min)
