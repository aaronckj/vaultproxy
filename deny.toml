# cargo-deny configuration for vaultproxy.
#
# Kept in sync with .cargo/audit.toml: the advisory IDs ignored below are the
# same ones cargo audit ignores, so both tools agree. Each ignore has an
# honest, short justification from the iter-4 / public-launch security review.

[advisories]
# Fail on any vulnerability not explicitly ignored below.
version = 2
yanked = "deny"
ignore = [
    # rsa 0.9 Marvin Attack (RSA timing side-channel). No fixed release exists.
    # Only reachable via trusted-upstream org-key unwrap at vault sync on a
    # localhost-only service; not attacker-influenced timing.
    "RUSTSEC-2023-0071",
    # rustls-pemfile unmaintained. Advisory only (no vuln); pulled transitively.
    "RUSTSEC-2025-0134",
    # lru 0.12.5 unsound IterMut. Not used in the unsound pattern here.
    "RUSTSEC-2026-0002",
    # rand unsound advisory. Not exercised in an unsound code path here.
    "RUSTSEC-2026-0097",
]

[licenses]
version = 2
# Typical permissive Rust ecosystem set. If the build surfaces another
# obscure-but-permissive license, add it here rather than blocking the build.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots ships the Mozilla CA bundle under CDLA-Permissive-2.0
    # (Community Data License Agreement — Permissive). Permissive, data-license.
    "CDLA-Permissive-2.0",
]
# 0.8 is the cargo-deny default; high enough to avoid false matches on
# slightly-reworded license text without rejecting valid permissive licenses.
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate are common and non-fatal; warn so they
# are visible without failing the supply-chain gate.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only crates.io is used (no git sources in Cargo.lock). Unknown registries or
# git sources should fail the build.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
