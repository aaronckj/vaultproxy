<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vault Proxy — Approvals</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .approval-card {
            background: var(--card-bg, #1e1e2e);
            border: 1px solid var(--border, #313244);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .approval-card .prompt {
            font-size: 0.95rem;
            color: var(--text-muted, #a6adc8);
            margin-bottom: 0.75rem;
            white-space: pre-wrap;
        }
        .approval-card .meta {
            font-size: 0.8rem;
            color: var(--text-dim, #6c7086);
            margin-bottom: 0.75rem;
        }
        .approval-card img.screenshot {
            max-width: 100%;
            max-height: 400px;
            border-radius: 4px;
            border: 1px solid var(--border, #313244);
            display: block;
            margin-bottom: 0.75rem;
        }
        .approval-card .code-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }
        .approval-card .code-row input {
            flex: 1;
            min-width: 120px;
            max-width: 220px;
            font-family: monospace;
            font-size: 1rem;
            letter-spacing: 0.15em;
            padding: 0.4rem 0.6rem;
            background: var(--input-bg, #181825);
            border: 1px solid var(--border, #313244);
            border-radius: 4px;
            color: inherit;
        }
        .approval-card .actions {
            display: flex;
            gap: 0.5rem;
        }
        .btn-approve {
            background: #a6e3a1;
            color: #1e1e2e;
            border: none;
            border-radius: 4px;
            padding: 0.4rem 1rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-approve:hover { background: #94d08a; }
        .btn-deny {
            background: #f38ba8;
            color: #1e1e2e;
            border: none;
            border-radius: 4px;
            padding: 0.4rem 1rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-deny:hover { background: #e07090; }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted, #a6adc8);
            font-size: 1rem;
        }
        .refresh-indicator {
            font-size: 0.75rem;
            color: var(--text-dim, #6c7086);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <nav>
        <span class="brand">Vault Proxy</span>
        <a href="/">Overview</a>
        <a href="/items">Items</a>
        <a href="/sync">Sync</a>
        <a href="/audit">Audit</a>
        <a href="/audit-runs">Credential Audit</a>
        <a href="/policies">Policies</a>
        <a href="/approvals" class="active">Approvals</a>
        <a href="/settings">Settings</a>
        <a href="/permissions">Permissions</a>
        <a href="/audit-log">Audit Log</a>
    </nav>
    <div class="container">
        <h1>2FA Approval Queue</h1>
        <p class="refresh-indicator" id="refresh-indicator">Auto-refreshing every 3 seconds...</p>
        <div id="queue-container"></div>
    </div>

    <script>
    (function () {
        'use strict';

        var REFRESH_INTERVAL = 3000;

        function clearChildren(el) {
            while (el.firstChild) {
                el.removeChild(el.firstChild);
            }
        }

        function renderEmpty() {
            var container = document.getElementById('queue-container');
            clearChildren(container);
            var div = document.createElement('div');
            div.className = 'empty-state';
            div.textContent = 'No pending approvals.';
            container.appendChild(div);
        }

        function renderApprovals(items) {
            var container = document.getElementById('queue-container');
            clearChildren(container);

            if (!items || items.length === 0) {
                renderEmpty();
                return;
            }

            items.forEach(function (item) {
                var card = document.createElement('div');
                card.className = 'approval-card';

                // Screenshot
                if (item.screenshot_b64) {
                    var img = document.createElement('img');
                    img.className = 'screenshot';
                    img.alt = '2FA screenshot';
                    img.src = 'data:image/png;base64,' + item.screenshot_b64;
                    card.appendChild(img);
                }

                // Prompt
                var promptEl = document.createElement('div');
                promptEl.className = 'prompt';
                promptEl.textContent = item.prompt || '';
                card.appendChild(promptEl);

                // Meta
                var meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = 'Created: ' + (item.created_at || 'unknown') +
                    '  |  Expires: ' + (item.expires_at || 'unknown') +
                    '  |  ID: ' + (item.id || '');
                card.appendChild(meta);

                // Code input row
                var codeRow = document.createElement('div');
                codeRow.className = 'code-row';
                var codeInput = document.createElement('input');
                codeInput.type = 'text';
                codeInput.placeholder = '2FA code (optional)';
                codeInput.maxLength = 32;
                codeInput.setAttribute('autocomplete', 'one-time-code');
                codeRow.appendChild(codeInput);
                card.appendChild(codeRow);

                // Action buttons
                var actions = document.createElement('div');
                actions.className = 'actions';

                var approveBtn = document.createElement('button');
                approveBtn.className = 'btn-approve';
                approveBtn.textContent = 'Approve';
                approveBtn.addEventListener('click', (function (capturedId, capturedCard) {
                    return function () {
                        respond(capturedId, 'approved', codeInput.value.trim(), capturedCard);
                    };
                })(item.id, card));

                var denyBtn = document.createElement('button');
                denyBtn.className = 'btn-deny';
                denyBtn.textContent = 'Deny';
                denyBtn.addEventListener('click', (function (capturedId, capturedCard) {
                    return function () {
                        respond(capturedId, 'denied', null, capturedCard);
                    };
                })(item.id, card));

                actions.appendChild(approveBtn);
                actions.appendChild(denyBtn);
                card.appendChild(actions);

                container.appendChild(card);
            });
        }

        function respond(id, action, code, cardEl) {
            var body = { id: id, action: action };
            if (code) { body.code = code; }

            fetch('/api/approvals', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.ok) {
                    cardEl.style.opacity = '0.4';
                    cardEl.style.pointerEvents = 'none';
                    loadApprovals();
                } else {
                    alert('Error: ' + (data.error || 'unknown'));
                }
            })
            .catch(function (err) {
                alert('Request failed: ' + err);
            });
        }

        function loadApprovals() {
            fetch('/api/approvals')
                .then(function (res) {
                    if (!res.ok) { throw new Error('HTTP ' + res.status); }
                    return res.json();
                })
                .then(function (data) {
                    renderApprovals(Array.isArray(data) ? data : []);
                    updateRefreshIndicator(false);
                })
                .catch(function () {
                    updateRefreshIndicator(true);
                });
        }

        function updateRefreshIndicator(error) {
            var el = document.getElementById('refresh-indicator');
            var now = new Date();
            var ts = now.getHours().toString().padStart(2, '0') + ':' +
                      now.getMinutes().toString().padStart(2, '0') + ':' +
                      now.getSeconds().toString().padStart(2, '0');
            el.textContent = (error ? 'Error loading — last attempt: ' : 'Last refreshed: ') +
                              ts + ' (auto-refreshes every 3 seconds)';
        }

        loadApprovals();
        setInterval(loadApprovals, REFRESH_INTERVAL);
    })();
    </script>
</body>
</html>
