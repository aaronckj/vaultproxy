name: Supply-chain audit

# Supply-chain security gate for public CI.
#   - cargo audit: scans Cargo.lock against the RustSec advisory DB.
#   - cargo deny: advisories + bans + licenses + sources policy (deny.toml).
#
# Runs on every push and pull request, plus a weekly schedule so newly
# disclosed advisories against the *already-merged* lockfile are surfaced
# even when no code changes land.
#
# Documented-ignored advisories live in BOTH .cargo/audit.toml (cargo audit)
# and deny.toml (cargo deny) so the two tools agree. See those files for the
# per-advisory justification.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Mondays 07:00 UTC — weekly re-scan of the committed lockfile.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # rustsec/audit-check reads .cargo/audit.toml automatically, so the
      # documented-ignored advisories there are respected. Fails the job on
      # any non-ignored vulnerability.
      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Advisories are covered by the `cargo audit` job above (rustsec/audit-check),
      # which respects .cargo/audit.toml. cargo-deny handles licenses, banned
      # crates, and source policy here. (The advisory DB is intentionally NOT
      # re-scanned via cargo-deny — its bundled rustsec parser currently chokes
      # on a malformed upstream advisory entry; cargo audit parses it fine.)
      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@9b7d65878c2d28c8e3c16e30bf555c29abe505bd # v2.0.11
        with:
          command: check bans licenses sources
