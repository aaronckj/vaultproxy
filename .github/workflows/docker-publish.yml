name: Build and publish Docker image

# Triggers:
#   - Tag push matching v* (e.g. v0.2.0) — builds and pushes the versioned tag
#     plus `latest` to ghcr.io/aaronckj/vaultproxy.
#   - Pull requests against main — build only (no push) to catch Dockerfile
#     breakage before merge.
#
# The image is built with the `dashboard` feature enabled (same as the local
# Dockerfile).  TPM support is intentionally excluded from the published image
# because it requires TSS2 system libraries and a physical TPM.
#
# Usage:
#   git tag v0.2.1 && git push origin v0.2.1
#
# After the workflow succeeds, the image is available at:
#   ghcr.io/aaronckj/vaultproxy:v0.2.1
#   ghcr.io/aaronckj/vaultproxy:latest

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aaronckj/vaultproxy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (version from rust-toolchain.toml)
        # dtolnay/rust-toolchain@master requires an explicit `toolchain` input —
        # it does NOT auto-read rust-toolchain.toml (despite the docs implying
        # otherwise). We pass `toolchain: stable` explicitly here so CI matches
        # the channel declared in rust-toolchain.toml. If the channel in that
        # file changes (e.g. to a specific version), update this line too.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust build cache
        # Caches ~/.cargo registry/cache + target/ keyed on
        # Cargo.lock + toolchain + workflow file hashes. Drops cold-cache
        # CI runs from ~21min (observed on v1.0.4) to ~5min.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "transparent-feature-matrix"
          cache-on-failure: true

      - name: Check formatting
        # iter-49: enforce cargo fmt before anything else so a misformatted PR
        # fails fast with a clear message rather than a build/test failure.
        run: cargo fmt --check

      - name: Run Clippy
        # iter-49: CI must enforce the same clippy-clean requirement stated in
        # CONTRIBUTING.md.  Without this step a PR that introduces a new
        # warning would pass CI, contradicting the stated policy.
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Clippy (full feature matrix)
        # iter-83: the browser and engine modules are feature-gated, so the
        # default-features clippy step above never compiles them and cannot catch
        # dead-code or other warnings introduced in those modules.  Running a
        # second clippy pass with all three opt-in features ensures that
        # iter-82's targeted #[allow(dead_code)] annotations remain correct as
        # the scaffold is wired up, and that no new warnings creep in under
        # any feature combination.
        run: cargo clippy --all-targets --features browser,engine,dashboard -- -D warnings

      - name: Run tests
        # iter-43: --all-targets ensures tests in [[bench]], [[example]], and
        # integration test binaries are all exercised.  Without it, cargo test
        # only compiles and runs lib + [[bin]] tests, silently skipping any
        # test functions inside bench or example targets.
        run: cargo test --all-targets

      - name: Run tests (full feature matrix)
        # iter-82: the browser and engine modules are feature-gated and not
        # compiled in the default build above.  Running with all three opt-in
        # features exercises the 28 gated tests (browser_rotate_guard_tests +
        # engine_client + orchestrator tests) and catches regressions in any
        # feature combination before merge.  The dashboard feature adds no
        # tests of its own but is included so the feature-combination compile
        # path (browser + engine + dashboard together) is validated in CI.
        run: cargo test --all-targets --features browser,engine,dashboard

      - name: Run integration tests
        # --test-threads=1 serialises the transparent smoke clients
        # (curl/python/node) that share the VP_TRANSPARENT_TEST_HTTP
        # process-global env var. Removing the flag lets the smoke
        # tests race and fail intermittently.
        run: cargo test --all-targets --features test-utils -- --test-threads=1

      - name: Clippy (transparent feature)
        # iter-126 (v1.1.0-beta.2): the transparent HTTPS_PROXY listener
        # is a separate compilation path. Without this step a clippy
        # regression in src/proxy/transparent/* would only surface when
        # an operator built with --features transparent.
        run: cargo clippy --all-targets --features transparent,test-utils -- -D warnings

      - name: Run tests (transparent feature)
        # Same rationale: the host_inject / placeholder E2Es only compile
        # under --features transparent,test-utils. --test-threads=1
        # serialises the smoke clients (curl / python / node) because
        # they share the VP_TRANSPARENT_TEST_HTTP env var.
        run: cargo test --all-targets --features transparent,test-utils -- --test-threads=1

      - name: Clippy (all features)
        # All four opt-in features together — guarantees no new feature
        # combination breaks compilation or surfaces a clippy warning.
        run: cargo clippy --all-targets --features browser,engine,dashboard,transparent,test-utils -- -D warnings

      - name: Run tests (all features)
        run: cargo test --all-targets --features browser,engine,dashboard,transparent,test-utils -- --test-threads=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Only authenticate on tag pushes — PRs run without push permissions.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            IMAGE_VERSION=${{ steps.meta.outputs.version }}

