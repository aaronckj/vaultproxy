name: Build and publish Docker image

# Triggers:
#   - Tag push matching v* (e.g. v0.2.0) — builds and pushes the versioned tag
#     plus `latest` to ghcr.io/aaronckj/vaultproxy.
#   - Pull requests against main — build only (no push) to catch Dockerfile
#     breakage before merge.
#
# The image is built with the `dashboard` feature enabled (same as the local
# Dockerfile).  TPM support is intentionally excluded from the published image
# because it requires TSS2 system libraries and a physical TPM.
#
# Usage:
#   git tag v0.2.1 && git push origin v0.2.1
#
# After the workflow succeeds, the image is available at:
#   ghcr.io/aaronckj/vaultproxy:v0.2.1
#   ghcr.io/aaronckj/vaultproxy:latest

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aaronckj/vaultproxy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (version from rust-toolchain.toml)
        # dtolnay/rust-toolchain@master requires an explicit `toolchain` input —
        # it does NOT auto-read rust-toolchain.toml (despite the docs implying
        # otherwise). We pass `toolchain: stable` explicitly here so CI matches
        # the channel declared in rust-toolchain.toml. If the channel in that
        # file changes (e.g. to a specific version), update this line too.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        # iter-49: enforce cargo fmt before anything else so a misformatted PR
        # fails fast with a clear message rather than a build/test failure.
        run: cargo fmt --check

      - name: Run Clippy
        # iter-49: CI must enforce the same clippy-clean requirement stated in
        # CONTRIBUTING.md.  Without this step a PR that introduces a new
        # warning would pass CI, contradicting the stated policy.
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        # iter-43: --all-targets ensures tests in [[bench]], [[example]], and
        # integration test binaries are all exercised.  Without it, cargo test
        # only compiles and runs lib + [[bin]] tests, silently skipping any
        # test functions inside bench or example targets.
        run: cargo test --all-targets

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Only authenticate on tag pushes — PRs run without push permissions.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
