# Rust toolchain channel declaration.
#
# This file is read by rustup (local development) and dtolnay/rust-toolchain
# in GitHub Actions. Using "stable" here means developers always use the
# current stable release; the CI workflow independently pins to a specific
# version for reproducibility (see .github/workflows/docker-publish.yml).
#
# When adopting a Rust feature that requires a minimum release (e.g. a new
# stdlib stabilisation), update the CI workflow's toolchain pin at the same
# time to a version that includes that feature.

[toolchain]
channel = "stable"
# clippy is required by CI (cargo clippy --deny warnings would fail without it).
# rustfmt is required for any formatting checks.  A fresh `rustup` install from
# this file will include both so new contributors don't hit "clippy not found"
# after cloning.
components = ["clippy", "rustfmt"]
